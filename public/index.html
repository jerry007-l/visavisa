<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2C3E50">
    <meta name="description" content="面签三分钟 - 单机版签证模拟游戏">
    <title>面签三分钟 - 单机版</title>
    <!-- PWA manifest - only load on http/https -->
    <script>
        if (location.protocol.startsWith('http')) {
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = 'manifest.json';
            document.head.appendChild(link);
        }
    </script>
    <link rel="icon" href="assets/icon.png" type="image/png">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/shop.css">
    <link rel="stylesheet" href="css/itemQuickUse.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/result.css">
    <!-- PWA配置 - 使用http/https协议的占位符 -->
    <script src="js/userData.js"></script>
    <script src="js/questionBank.js"></script>
    <script src="js/identityPool.js"></script>
    <script src="js/materialPool.js"></script>
    <script src="js/items.js"></script>
    <script src="js/randomEvents.js"></script>
    <script src="js/achievements.js"></script>
    <script src="js/soundManager.js"></script>
    <script src="js/audioInit.js"></script>
    <script>
        // 显示音效提示
        if ('AudioContext' in window || 'webkitAudioContext' in window) {
            console.log('🔊 游戏音效已就绪，点击任意位置开始');
        }
        
        // 页面加载后首次点击初始化音频
        window.addEventListener('load', () => {
            const initAudio = () => {
                if (SoundManager && SoundManager.init) {
                    SoundManager.init();
                }
                document.removeEventListener('click', initAudio);
            };
            document.addEventListener('click', initAudio);
        });
    </script>
</head>
<body>
    <!-- 主菜单 -->
    <div id="mainMenu" class="screen active">
        <div class="menu-container">
            <h1 class="game-title">🎮 面签三分钟</h1>
            <p class="game-subtitle">单机版 - 虚拟签证体验</p>
            <div class="menu-buttons">
                <button class="btn-primary" onclick="Game.startRoleSelect()">开始游戏</button>
                <button class="btn-secondary" onclick="Game.showAchievements()">成就系统</button>
                <button class="btn-secondary" onclick="Game.showStats()">数据统计</button>
                <button class="btn-secondary" onclick="Game.toggleSound()">🔊 音效</button>
            </div>
            <div class="coin-display">
                💰 当前金币: <span id="MainMenuCoins">200</span> VC
            </div>
        </div>
    </div>

    <!-- 角色选择 -->
    <div id="roleSelect" class="screen">
        <div class="role-container">
            <h2>选择你的角色</h2>
            <div class="role-cards">
                <div class="role-card" onclick="Game.selectRole('officer')">
                    <div class="role-icon">👔</div>
                    <h3>签证官</h3>
                    <p>判断申请人是否诚实，决定是否给予签证</p>
                    <div class="role-features">
                        <span>🔍 审查材料</span>
                        <span>❓ 提问环节</span>
                        <span>✅ 做出决策</span>
                    </div>
                </div>
                <div class="role-card" onclick="Game.selectRole('applicant')">
                    <div class="role-icon">🧳</div>
                    <h3>申请人</h3>
                    <p>通过话术和道具获得签证，欺骗签证官</p>
                    <div class="role-features">
                        <span>📄 提交材料</span>
                        <span>🗣️ 回答问题</span>
                        <span>🎭 使用道具</span>
                    </div>
                </div>
            </div>
            <button class="btn-back" onclick="Game.showScreen('mainMenu')">返回主页</button>
        </div>
    </div>

    <!-- 道具购买阶段 -->
    <div id="shopPhase" class="screen">
        <div class="shop-container">
            <h2>🛒 道具商店</h2>
            <div class="coin-info">💰 当前金币: <span id="ShopCoins">200</span> VC</div>
            <div class="time-limit">⏰ 限时: <span id="ShopTimer">60</span>秒</div>
            <div id="ShopItems" class="shop-items"></div>
            <button class="btn-primary" onclick="Game.confirmPurchase()">确认并继续</button>
        </div>
    </div>

    <!-- 材料抽奖 -->
    <div id="materialDraw" class="screen">
        <div class="draw-container">
            <h2>🎰 材料抽奖</h2>
            <p class="hint-text">随机抽取2份材料（可能有用哦）</p>
            <div class="slot-machine" id="SlotMachine">
                <div class="slot-item">📄</div>
                <div class="slot-item">📄</div>
            </div>
            <button class="btn-primary" onclick="Game.drawMaterials()">开始抽奖</button>
            <button class="btn-secondary" onclick="Game.confirmMaterials()" style="display:none;">确认并继续</button>
        </div>
    </div>

    <!-- 材料审核 -->
    <div id="materialReview" class="screen">
        <div class="review-container">
            <h2>📋 材料审核环节</h2>
            <div id="MaterialCards" class="material-cards"></div>
            <div id="OfficerTools" class="officer-tools" style="display:none;"></div>
            <button class="btn-primary" onclick="Game.nextPhase()">审核完成</button>
        </div>
    </div>

    <!-- 对话问答 -->
    <div id="dialogue" class="screen">
        <div class="dialogue-container">
            <h2>❓ 对话问答环节</h2>
            <div class="round-info">第 <span id="CurrentRound">1</span> / <span id="TotalRounds">4</span> 轮</div>
            <div class="timer-bar">
                <div id="TimerBar" class="timer-fill"></div>
                <span id="TimerText">30s</span>
            </div>
            <div id="QuestionArea" class="question-area"></div>
            <div id="AnswerOptions" class="answer-options"></div>
            <div id="DialogueHistory" class="dialogue-history"></div>
        </div>
    </div>

    <!-- 随机事件 -->
    <div id="randomEvent" class="screen">
        <div class="event-container">
            <h2 id="EventTitle">⚡ 随机事件</h2>
            <div id="EventContent" class="event-content"></div>
            <div id="EventChoices" class="event-choices"></div>
        </div>
    </div>

    <!-- 最终决策 -->
    <div id="finalDecision" class="screen">
        <div class="decision-container">
            <h2>⚖️ 最终决策</h2>
            <div id="DecisionSummary" class="decision-summary"></div>
            
            <!-- 签证官选择按钮 -->
            <div class="decision-buttons" id="OfficerDecisionBtns">
                <button class="btn-approve" onclick="Game.makeDecision('approve')">✅ 通过签证</button>
                <button class="btn-reject" onclick="Game.makeDecision('reject')">❌ 拒绝签证</button>
                <button class="btn-submit" onclick="Game.makeDecision('submit')">📤 主动结束</button>
            </div>
            
            <!-- 申请人提示（自动评估） -->
            <div id="ApplicantNotice" style="display: none; text-align: center; margin-top: 20px;">
                <p style="color: #3C3B6E; font-size: 1.1em; font-weight: bold;">
                    🤖 系统将自动根据你的表现评估结果...
                </p>
            </div>
        </div>
    </div>

    <!-- 结算界面 -->
    <div id="resultScreen" class="screen">
        <div class="result-container">
            <h2 id="ResultTitle">游戏结果</h2>
            <div id="ResultContent" class="result-content"></div>
            <div class="result-stats"></div>
            <div id="AchievementUnlocks" class="achievement-unlocks"></div>
            <button class="btn-primary" onclick="Game.backToMain()">返回主页</button>
        </div>
    </div>

    <!-- 聊天面板 -->
    <div id="chatPanel" class="chat-panel">
        <div class="chat-header">
            <span>💬 聊天记录</span>
            <button onclick="Chat.toggle()">✕</button>
        </div>
        <div id="ChatMessages" class="chat-messages"></div>
        <div class="chat-input">
            <input type="text" id="ChatInput" placeholder="输入消息..." maxlength="100">
            <button onclick="Chat.send()">发送</button>
        </div>
    </div>

    <!-- 聊天按钮 -->
    <button id="ChatToggle" class="chat-toggle-btn" onclick="Chat.toggle()">💬</button>
    
    <!-- 道具快捷使用按钮 -->
    <button id="ItemQuickUseBtn" class="item-quick-use-btn" onclick="ItemQuickUse.toggle()" style="display: none;">🎒</button>

    <script src="js/main.js"></script>
    <script src="js/roleSelect.js"></script>
    <script src="js/shop.js"></script>
    <script src="js/itemQuickUse.js"></script>
    <script src="js/drawMaterials.js"></script>
    <script src="js/materialReview.js"></script>
    <script src="js/dialogue.js"></script>
    <script src="js/decision.js"></script>
    <script src="js/result.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/randomEventHandle.js"></script>
    <script src="js/achievement.js"></script>
    <script src="js/selfCheck.js"></script>
    <script>
        // Service Worker 注册
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.error('SW registration failed:', err));
        }
    </script>
</body>
</html>
